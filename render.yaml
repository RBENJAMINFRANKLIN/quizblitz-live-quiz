# Render Blueprint: one click deploy of QuizBlitz on Render's free plan.
services:
  - type: web
    name: quizblitz
    runtime: node
    plan: free
    buildCommand: echo "nothing to build"
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: COOKIE_SECURE
        value: "true"
      - key: REPORTS_KEY
        generateValue: true
